<svg version="1.1" width="1200" height="143" viewBox="0 0 1200 143" xmlns="http://www.w3.org/2000/svg">
<style type="text/css">
text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #111; pointer-events: none; }
.func:hover { stroke: #000; stroke-width: 1.5; cursor: pointer; filter: brightness(1.15); }
</style>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="10" y="28" font-size="18" font-weight="bold" fill="#2c3e50">CPU Flame Graph: Baseline Execution (-O0, No Vectorization)</text>
<text x="10" y="48" font-size="12" fill="#7f8c8d">Total samples: 4,200 (100.0%) | Click to inspect details</text>
<text id="details" x="500" y="48" font-size="12" font-weight="bold" fill="#c0392b"></text>
<g class="func" onclick="showDetails('main', 4200, 100.00)">
  <title>main (4,200 samples, 100.00%)</title>
  <rect x="10.00" y="102.00" width="1179.50" height="20" fill="#f06543" rx="2" ry="2"/>
  <text x="14.00" y="116.00">main</text>
</g>
<g class="func" onclick="showDetails('benchmark_pipeline', 4080, 97.14)">
  <title>benchmark_pipeline (4,080 samples, 97.14%)</title>
  <rect x="10.00" y="81.00" width="1145.79" height="20" fill="#f28e2b" rx="2" ry="2"/>
  <text x="14.00" y="95.00">benchmark_pipeline</text>
</g>
<g class="func" onclick="showDetails('init_dataset', 120, 2.86)">
  <title>init_dataset (120 samples, 2.86%)</title>
  <rect x="1156.29" y="81.00" width="33.21" height="20" fill="#e15759" rx="2" ry="2"/>
</g>
<g class="func" onclick="showDetails('compute_heavy_workload', 2840, 67.62)">
  <title>compute_heavy_workload (2,840 samples, 67.62%)</title>
  <rect x="10.00" y="60.00" width="797.40" height="20" fill="#ffbe4d" rx="2" ry="2"/>
  <text x="14.00" y="74.00">compute_heavy_workload</text>
</g>
<g class="func" onclick="showDetails('process_subtask_a', 680, 16.19)">
  <title>process_subtask_a (680 samples, 16.19%)</title>
  <rect x="807.90" y="60.00" width="190.55" height="20" fill="#d33f49" rx="2" ry="2"/>
  <text x="811.90" y="74.00">process_subtask_a</text>
</g>
<g class="func" onclick="showDetails('process_subtask_b', 560, 13.33)">
  <title>process_subtask_b (560 samples, 13.33%)</title>
  <rect x="998.95" y="60.00" width="156.83" height="20" fill="#ed7d31" rx="2" ry="2"/>
  <text x="1002.95" y="74.00">process_subtask_b</text>
</g>
<script type="text/javascript">
function showDetails(name, samples, pct) {
  document.getElementById("details").textContent = "Selected: " + name + " -> " + samples + " samples (" + pct + "%)";
}
</script>
</svg>